<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-labelledby="t d" preserveAspectRatio="xMidYMid meet">
  <title id="t">NOOR DIGITAL — Mamadou Dia Seck · Software Developer, Digital Products, Web Applications</title>
  <desc id="d">Editorial GitHub profile banner. Warm ivory canvas, violet aperture over a technical lattice, bold typography. NOOR DIGITAL — La lumière qui structure.</desc>
  <defs>
    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5433EB" stop-opacity="0.55"/>
      <stop offset="38%" stop-color="#5433EB" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#5433EB" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="horizon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6F1E7"/>
      <stop offset="1" stop-color="#EEE8DA"/>
    </linearGradient>
    <pattern id="lattice" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0v28M0 28h28" fill="none" stroke="#171717" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <clipPath id="frame"><rect x="0" y="0" width="1200" height="400" rx="20" ry="20"/></clipPath>
    <mask id="rightMask">
      <rect x="0" y="0" width="1200" height="400" fill="black"/>
      <rect x="540" y="0" width="660" height="400" fill="white"/>
    </mask>
  </defs>

  <g clip-path="url(#frame)">
    <!-- Canvas -->
    <rect width="1200" height="400" fill="url(#horizon)"/>

    <!-- Technical lattice (right third) -->
    <rect width="1200" height="400" fill="url(#lattice)" mask="url(#rightMask)"/>

    <!-- Hairline rules framing the composition -->
    <path d="M0 1 h1200" stroke="#171717" stroke-opacity="0.18" stroke-width="2"/>
    <path d="M0 399 h1200" stroke="#171717" stroke-opacity="0.18" stroke-width="2"/>

    <!-- Aperture: concentric rings -->
    <g transform="translate(920 200)" fill="none" stroke="#5433EB">
      <circle r="168" stroke-opacity="0.10" stroke-width="1"/>
      <circle r="132" stroke-opacity="0.16" stroke-width="1"/>
      <circle r="96"  stroke-opacity="0.26" stroke-width="1"/>
      <circle r="60"  stroke-opacity="0.44" stroke-width="1.2"/>
      <!-- cardinal ticks -->
      <path d="M-182 0 h-18 M182 0 h18 M0 -182 v-18 M0 182 v18" stroke-width="2" stroke-opacity="0.38"/>
      <!-- Diagonal scaffolding -->
      <path d="M-156 -156 L156 156 M-156 156 L156 -156" stroke-opacity="0.08" stroke-width="1"/>
    </g>

    <!-- Light aura -->
    <circle cx="920" cy="200" r="200" fill="url(#aura)"/>
    <circle cx="920" cy="200" r="22" fill="#5433EB"/>
    <circle cx="920" cy="200" r="6"  fill="#F6F1E7"/>

    <!-- Left editorial rule -->
    <path d="M60 86 v228" stroke="#5433EB" stroke-width="2"/>

    <!-- NOOR DIGITAL mark -->
    <g transform="translate(80 100)">
      <circle cx="0" cy="-6" r="6" fill="#5433EB"/>
      <text x="18" y="0" fill="#171717" font-family="'Inter','Segoe UI',Roboto,system-ui,sans-serif" font-size="13" font-weight="700" letter-spacing="3.6">NOOR DIGITAL</text>
    </g>

    <!-- Hero name -->
    <text x="80" y="212" fill="#171717" font-family="'Inter','Segoe UI',Roboto,system-ui,sans-serif" font-size="64" font-weight="700" letter-spacing="-1.6">MAMADOU DIA SECK</text>

    <!-- Divider -->
    <path d="M80 238 h340" stroke="#171717" stroke-opacity="0.22" stroke-width="1.5"/>

    <!-- Positioning line -->
    <text x="80" y="270" fill="#3F3B45" font-family="'Inter','Segoe UI',Roboto,system-ui,sans-serif" font-size="16" font-weight="500" letter-spacing="2.4">SOFTWARE DEVELOPER · DIGITAL PRODUCTS · WEB APPLICATIONS</text>

    <!-- Signature -->
    <text x="80" y="326" fill="#6E6A6F" font-family="'Inter','Segoe UI',Roboto,system-ui,sans-serif" font-size="12" font-weight="500" letter-spacing="3">LA LUMIÈRE QUI STRUCTURE  ·  DAKAR, SÉNÉGAL</text>

    <!-- Top-right edition tag -->
    <g transform="translate(1152 32)" text-anchor="end">
      <text fill="#171717" fill-opacity="0.45" font-family="'Inter','Segoe UI',Roboto,system-ui,sans-serif" font-size="10" font-weight="600" letter-spacing="3">EDITION 2026</text>
    </g>
  </g>
</svg>
